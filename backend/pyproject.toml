[project]
name = "studentsai-backend"
version = "1.0.0"
description = "StudentsAI FastAPI backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends() in defaults is the framework idiom
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
